# trio.shinsulab.com — TRIOSMART sau proxy Cloudflare
# Cần: include /etc/nginx/conf.d/cloudflare-realip.conf trong khối http{} (dải IP thật + limit_req_zone)
# API (:3002) phục vụ cả frontend build; receiver webhook (:3001) chỉ lộ /hooks/

server {
    listen 80;
    listen [::]:80;
    server_name trio.shinsulab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trio.shinsulab.com;

    ssl_certificate /etc/letsencrypt/live/shinsulab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shinsulab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chỉ nhận kết nối TỪ dải IP Cloudflare. Không kiểm tra bằng header
    # (if $http_cf_connecting_ip = "") — header đó ai cũng tự đặt được, guard vô dụng.
    include /etc/nginx/snippets/trio-cloudflare-allow.inc;

    client_max_body_size 2m;
    server_tokens off;

    # Webhook Pancake → receiver (raw-write-only, luôn 200 nhanh).
    # KHÔNG ghi access log: secret của webhook chat nằm ngay trong URL, ghi log là lộ secret.
    location /hooks/ {
        access_log off;
        limit_req zone=trio_hooks burst=60 nodelay;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Đăng nhập — siết chặt nhất (chống dò mật khẩu ngay từ tầng nginx)
    location /api/auth/login {
        limit_req zone=trio_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + frontend build
    location / {
        limit_req zone=trio_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/trio.access.log;
    error_log  /var/log/nginx/trio.error.log;
}
